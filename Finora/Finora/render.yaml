# Render.com Blueprint - GitHub repo connect karte hi Finora (frontend + backend + database) live ho jata hai.
services:
  - type: web
    name: finora
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
