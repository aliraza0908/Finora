<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us - Finora</title>
<meta name="description" content="Get in touch with the Finora team.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="contact">
<header class="site-header" id="site-header"></header>
<main>
<div class="container">
  <div class="page-head"><h1>Get in touch</h1><p>Questions, feedback or ideas? Send us a message and we will reply by email.</p></div>
  <div class="grid g2" style="align-items:start">
    <section class="card"><h3>Contact details</h3>
      <ul class="info-list"><li><b>Address</b><span>123 Main Street, Sahiwal, Pakistan</span></li><li><b>Phone</b><span>+92 300 000000009</span></li><li><b>Email</b><span>info@finora.com</span></li></ul></section>
    <form class="card" id="contact-form" novalidate>
      <h3>Send a message</h3><div class="form-msg" role="alert"></div>
      <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name"><div class="err"></div></div>
      <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email"><div class="err"></div></div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" maxlength="1000"></textarea><div class="err"></div></div>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/contact.js"></script>
</body>
</html>
