<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - Finora</title>
<meta name="description" content="Create your free Finora account.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="signup" class="">
<header class="site-header" id="site-header"></header>
<main>
<div class="container auth-wrap">
  <section class="card auth-card">
    <h1>Create your account</h1>
    <p class="sub">Start tracking your money in under a minute.</p>
    <form id="signup-form" novalidate>
      <div class="form-msg" role="alert"></div>
      <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><div class="err"></div></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="err"></div></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="err"></div></div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
  </section>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
