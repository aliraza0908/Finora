<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - Finora</title>
<meta name="description" content="Manage your personal information and account settings.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="profile">
<header class="site-header" id="site-header"></header>
<main>
<div class="container">
  <div class="page-head"><h1 style="font-size:2rem">Your profile</h1><p>Update your details and keep your account secure.</p></div>
  <div class="grid g2" style="align-items:start">
    <section class="card" aria-label="Account">
      <div class="profile-head"><div class="avatar" id="avatar">?</div><div><h2 id="p-name" style="font-size:1.4rem">&nbsp;</h2><span class="muted small" id="p-email"></span></div></div>
      <ul class="info-list"><li><b>Member since</b><span id="p-since"></span></li><li><b>Entries</b><span id="p-count"></span></li></ul>
      <h3 style="margin-top:26px">Delete account</h3>
      <p class="muted small">This permanently removes your account and every transaction. It cannot be undone.</p>
      <button class="btn btn-danger btn-sm" type="button" id="delete-btn">Delete my account</button>
    </section>
    <div class="grid">
      <form class="card" id="info-form" novalidate>
        <h3>Personal information</h3><div class="form-msg" role="alert"></div>
        <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name"><div class="err"></div></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><div class="err"></div></div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
      <form class="card" id="pw-form" novalidate>
        <h3>Change password</h3><div class="form-msg" role="alert"></div>
        <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password"><div class="err"></div></div>
        <div class="field"><label for="next">New password</label><input id="next" name="next" type="password" autocomplete="new-password"><div class="err"></div></div>
        <button class="btn" type="submit">Update password</button>
      </form>
    </div>
  </div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
